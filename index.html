<!DOCTYPE html>
<html class="dark" lang="es">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>TIRR Robokids - Panel de Control</title>

    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

    <!-- Lógica del Sistema -->
    <script type="module" src="js/app.js"></script>
    <script defer src="js/alpine.min.js"></script>

    <link
        href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Manrope:wght@300;400;500;600;700&display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap"
        rel="stylesheet" />

    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-container-low": "#1c1b1b",
                        "surface-container-high": "#2a2a2a",
                        "secondary-container": "#ffdb3c",
                        "on-surface-variant": "#e8bcb5",
                        "on-primary-container": "#ffe2dd",
                        "on-tertiary-container": "#e8e8e8",
                        "surface-bright": "#393939",
                        "tertiary-container": "#676868",
                        "surface-tint": "#ffb4a8",
                        "on-error": "#690005",
                        "on-error-container": "#ffdad6",
                        "tertiary-fixed-dim": "#c6c6c7",
                        "on-surface": "#e5e2e1",
                        "outline-variant": "#5e3f3a",
                        "background": "#131313",
                        "secondary-fixed-dim": "#e9c400",
                        "secondary-fixed": "#ffe16d",
                        "on-secondary-fixed": "#221b00",
                        "primary-fixed-dim": "#ffb4a8",
                        "tertiary-fixed": "#e2e2e2",
                        "on-secondary": "#3a3000",
                        "inverse-surface": "#e5e2e1",
                        "outline": "#af8881",
                        "tertiary": "#c6c6c7",
                        "error": "#ffb4ab",
                        "surface-container": "#201f1f",
                        "on-secondary-container": "#725f00",
                        "secondary": "#fff9ef",
                        "primary-fixed": "#ffdad4",
                        "surface-container-highest": "#353534",
                        "on-primary": "#690000",
                        "on-tertiary-fixed": "#1a1c1c",
                        "inverse-primary": "#c00000",
                        "on-tertiary": "#2f3131",
                        "on-secondary-fixed-variant": "#544600",
                        "on-tertiary-fixed-variant": "#454747",
                        "surface-container-lowest": "#0e0e0e",
                        "primary": "#D30000",
                        "primary-light": "#ffb4a8",
                        "accent-gold": "#FFD700",
                        "peach": "#e8bcb5",
                        "surface": "#131313",
                        "inverse-on-surface": "#313030",
                        "on-primary-fixed-variant": "#930100",
                        "surface-dim": "#131313",
                        "on-background": "#e5e2e1",
                        "primary-container": "#d30000",
                        "error-container": "#93000a",
                        "on-primary-fixed": "#410000",
                        "surface-variant": "#353534"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "fontFamily": {
                        "headline": ["Space Grotesk"],
                        "body": ["Manrope"],
                        "label": ["Space Grotesk"]
                    }
                },
            },
        }
    </script>
    <style>
        body {
            font-family: 'Manrope', sans-serif;
            background-color: #131313;
            color: #e5e2e1;
        }

        .headline {
            font-family: 'Space Grotesk', sans-serif;
        }

        .material-symbols-outlined {
            font-family: 'Material Symbols Outlined' !important;
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

        .glass-panel {
            background: rgba(53, 53, 52, 0.4);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        .kinetic-glow:hover {
            box-shadow: 0 0 25px rgba(211, 0, 0, 0.3);
        }

        /* Tactical glows provided by user */
        .hover-glow-red:hover {
            box-shadow: 0 0 30px rgba(211, 0, 0, 0.3);
            border-color: rgba(211, 0, 0, 0.5);
        }

        .hover-glow-yellow:hover {
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.3);
            border-color: rgba(255, 215, 0, 0.5);
        }

        .hover-glow-emerald:hover {
            box-shadow: 0 0 30px rgba(16, 185, 129, 0.3);
            border-color: rgba(16, 185, 129, 0.5);
        }

        .hover-glow-cyan:hover {
            box-shadow: 0 0 30px rgba(0, 229, 255, 0.3);
            border-color: rgba(0, 229, 255, 0.5);
        }

        .neon-glow-red {
            filter: drop-shadow(0 0 10px rgba(211, 0, 0, 0.8));
            color: #ff3333 !important;
        }

        .neon-glow-gold {
            filter: drop-shadow(0 0 10px rgba(255, 215, 0, 0.8));
            color: #fff1aa !important;
        }

        .active-nav {
            background: linear-gradient(to right, rgba(211, 0, 0, 0.15) 0%, transparent 100%);
            border-right: 4px solid #D30000;
            color: #D30000 !important;
        }

        .custom-scrollbar::-webkit-scrollbar {
            width: 4px;
        }

        .custom-scrollbar::-webkit-scrollbar-track {
            background: #0e0e0e;
        }

        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #353534;
            border-radius: 10px;
        }

        /* New Tactical Styles */
        .glass-card {
            background: rgba(53, 53, 52, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .red-glow {
            box-shadow: 0 0 15px rgba(211, 0, 0, 0.2);
        }

        .yellow-glow {
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.2);
        }

        .green-glow {
            box-shadow: 0 0 15px rgba(16, 185, 129, 0.2);
        }

        .cyan-glow {
            box-shadow: 0 0 15px rgba(0, 229, 255, 0.2);
        }

        .headline-font {
            font-family: 'Space Grotesk', sans-serif;
        }

        /* Mobile menu toggle logic */
        #mobile-menu-checkbox:checked~aside {
            transform: translateX(0);
        }

        [x-cloak] {
            display: none !important;
        }
    </style>
</head>

<body class="custom-scrollbar overflow-x-hidden antialiased bg-[#0c0c0c] text-white" x-cloak
    x-data="{ activeTab: localStorage.getItem('activeTab') || 'dashboard' }"
    x-init="$watch('activeTab', val => { if(val) localStorage.setItem('activeTab', val); else localStorage.removeItem('activeTab'); }); document.addEventListener('guest:login', () => { activeTab = 'dashboard'; }); if (!localStorage.getItem('tirr_last_active')) { activeTab = 'dashboard'; }">

    <!-- Loader Inicial: controlado por JS puro, sin Alpine -->
    <div id="loading-screen"
        style="display:flex; position:fixed; inset:0; z-index:9999; background:#0c0c0c; flex-direction:column; align-items:center; justify-content:center; transition:opacity 0.4s;">
        <div style="display:flex; flex-direction:column; align-items:center; gap:16px;">
            <div
                style="width:48px;height:48px;border:4px solid rgba(211,0,0,0.15);border-top-color:#D30000;border-radius:50%;animation:spin 0.8s linear infinite;">
            </div>
            <p style="font-size:10px;font-weight:900;letter-spacing:0.5em;color:#D30000;text-transform:uppercase;">
                Iniciando Sistemas TIRR</p>
        </div>
    </div>
    <style>
        @keyframes spin {
            to {
                transform: rotate(360deg)
            }
        }
    </style>

    <!-- PANTALLA 1: LOGIN TÁCTICO (SELECCIÓN DE PERSONAL) -->
    <template x-if="!$store.app.isAuthenticated && !$store.app.isLoadingInitial">
        <div class="bg-[#0e0e0e] text-white h-screen flex flex-col items-center justify-between pb-24 px-6 overflow-y-auto overflow-x-hidden relative custom-scrollbar"
            x-data="{ 
                selectedSponsor: null, 
                showSponsorModal: false,
                localShowLogin: false,
                localUser: null,
                localPin: '',
                localError: null,
                localLoading: false,
                openLoginForm(u) {
                    this.localUser = u;
                    this.localPin = '';
                    this.localError = null;
                    this.localShowLogin = true;
                },
                async doLogin() {
                    if (!this.localUser || !this.localPin) return;
                    this.localLoading = true;
                    this.localError = null;
                    
                    // Aseguramos que pasamos los datos hacia el store global para usar firebase
                    $store.app.selectedLoginUser = this.localUser;
                    $store.app.loginPin = this.localPin;
                    
                    await $store.app.login();
                    
                    if ($store.app.loginError) {
                        this.localError = $store.app.loginError;
                    } else {
                        this.localShowLogin = false;
                    }
                    
                    this.localLoading = false;
                }
             }">

            <!-- Corner Ornaments for Login -->
            <div
                class="fixed top-6 left-6 w-32 h-32 border-t border-l border-white/5 pointer-events-none rounded-tl-[3rem]">
            </div>
            <div
                class="fixed top-6 right-6 w-32 h-32 border-t border-r border-white/5 pointer-events-none rounded-tr-[3rem]">
            </div>
            <div
                class="fixed bottom-6 left-6 w-32 h-32 border-b border-l border-white/5 pointer-events-none rounded-bl-[3rem]">
            </div>
            <div
                class="fixed bottom-6 right-6 w-32 h-32 border-b border-r border-white/5 pointer-events-none rounded-br-[3rem]">
            </div>

            <div class="text-center mb-4 mt-6 md:mt-12 relative z-10 shrink-0">
                <p
                    class="text-[#D30000] font-bold tracking-[0.6em] text-[10px] md:text-[11px] mb-1 uppercase headline opacity-70">
                    Torneo Internacional de Robótica Robokids</p>
                <h1
                    class="text-4xl md:text-5xl lg:text-6xl font-black headline tracking-tighter text-white leading-none">
                    <span class="text-white">SISTEMA</span> <span class="text-[#D30000]">TI</span><span
                        class="text-secondary-fixed">RR</span>
                </h1>
                <div class="h-1 w-20 bg-gradient-to-r from-primary to-transparent mx-auto mt-3"></div>
            </div>

            <div
                class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-5 lg:grid-cols-9 gap-2 md:gap-3 max-w-7xl w-full relative z-10 px-4 mb-6">
                <template :key="user.email + (user.photoURL || 'none')" x-for="user in $store.app.systemUsers">
                    <div @click="openLoginForm(user)"
                        class="bg-black/40 border border-white/10 p-3 md:p-4 rounded-[2rem] flex flex-col items-center justify-center cursor-pointer transition-all duration-500 hover:-translate-y-1 group backdrop-blur-sm relative overflow-hidden"
                        :data-role="user.role">

                        <!-- Glow effect matching user color -->
                        <div :style="'background: ' + user.hex"
                            class="absolute -top-10 -right-10 w-20 h-20 blur-2xl opacity-10 group-hover:opacity-20 transition-opacity">
                        </div>

                        <div class="relative mb-4">
                            <div :style="'border-color: ' + user.hex"
                                class="absolute inset-[-8px] rounded-full border-2 border-dashed opacity-15 group-hover:opacity-60 group-hover:rotate-90 transition-all duration-1000">
                            </div>
                            <div :style="'border-color: ' + user.hex"
                                class="w-12 h-12 md:w-14 md:h-14 rounded-full border-2 p-1 flex items-center justify-center relative z-10 shadow-xl transition-transform duration-500 group-hover:scale-110">
                                <template x-if="user.photoURL">
                                    <img :src="user.photoURL" class="w-full h-full object-cover rounded-full">
                                </template>
                                <template x-if="!user.photoURL">
                                    <div :style="'background-color: ' + user.hex"
                                        class="w-full h-full rounded-full flex items-center justify-center text-lg md:text-xl font-black headline text-black">
                                        <span class="material-symbols-outlined"
                                            x-text="user.role.includes('CRONOMETRISTA') ? 'timer' : user.role.includes('PRUEBA') ? 'science' : user.role.includes('AUXILIAR') ? 'engineering' : user.role.includes('ADMIN') ? 'admin_panel_settings' : 'gavel'"></span>
                                    </div>
                                </template>
                            </div>
                        </div>
                        <h3 class="text-[11px] md:text-xs font-black headline mb-0.5 tracking-tight text-white whitespace-nowrap text-center"
                            x-text="user.role"></h3>
                        <p class="text-[8px] md:text-[9px] font-black tracking-[0.15em] text-peach uppercase font-body whitespace-nowrap text-center"
                            x-text="user.name"></p>
                    </div>
                </template>
            </div>

            <!-- ACCESOS RÁPIDOS EXTERNOS: VISTA DE PRUEBA E INVITADO -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 w-full max-w-7xl px-4 mb-8 relative z-10">
                <!-- BOTÓN 1: VISTA DE PRUEBA (Para personas externas y revisión sistemática IA) -->
                <button @click="$store.app.loginAsVistaPrueba()" id="btn-vista-prueba" data-testid="login-vista-prueba"
                    class="bg-gradient-to-r from-purple-950/40 via-purple-900/20 to-black/60 border border-purple-500/30 hover:border-purple-400 p-4 md:p-5 rounded-[2rem] flex items-center justify-between gap-4 cursor-pointer transition-all duration-500 hover:-translate-y-1 group backdrop-blur-sm shadow-[0_0_30px_rgba(168,85,247,0.15)] text-left">
                    <div class="flex items-center gap-4">
                        <div
                            class="w-10 h-10 md:w-12 md:h-12 rounded-full bg-purple-500/20 border border-purple-500/40 flex items-center justify-center group-hover:bg-purple-500/30 group-hover:scale-110 transition-all text-purple-400 shrink-0">
                            <span class="material-symbols-outlined text-xl md:text-2xl">science</span>
                        </div>
                        <div>
                            <div class="flex items-center gap-2">
                                <h3 class="text-sm md:text-base font-black headline text-purple-200 group-hover:text-white transition-colors tracking-tight">
                                    VISTA DE PRUEBA</h3>
                                <span class="bg-purple-500/20 text-purple-300 border border-purple-500/40 text-[8px] md:text-[9px] font-black px-2 py-0.5 rounded-full uppercase tracking-wider">
                                    Demo & Auditoría IA
                                </span>
                            </div>
                            <p class="text-[9px] md:text-[10px] font-bold tracking-[0.15em] text-purple-300/60 uppercase">
                                Pruebas completas • Cronometría, Calificaciones y Registro interactivo
                            </p>
                        </div>
                    </div>
                    <span class="material-symbols-outlined text-purple-400/60 group-hover:text-purple-300 transition-colors shrink-0">rocket_launch</span>
                </button>

                <!-- BOTÓN 2: INVITADO (Solo Lectura) -->
                <button @click="$store.app.loginAsGuest()" id="btn-invitado" data-testid="login-invitado"
                    class="bg-white/[0.03] border border-white/10 hover:border-white/30 p-4 md:p-5 rounded-[2rem] flex items-center justify-between gap-4 cursor-pointer transition-all duration-500 hover:-translate-y-1 group backdrop-blur-sm text-left">
                    <div class="flex items-center gap-4">
                        <div
                            class="w-10 h-10 md:w-12 md:h-12 rounded-full bg-white/10 border border-white/20 flex items-center justify-center group-hover:bg-white/20 transition-all shrink-0">
                            <span class="material-symbols-outlined text-xl md:text-2xl text-white/60 group-hover:text-white transition-colors">visibility</span>
                        </div>
                        <div>
                            <div class="flex items-center gap-2">
                                <h3 class="text-sm md:text-base font-black headline text-white/80 group-hover:text-white transition-colors tracking-tight">
                                    INGRESAR COMO INVITADO</h3>
                                <span class="bg-white/10 text-gray-300 border border-white/20 text-[8px] md:text-[9px] font-black px-2 py-0.5 rounded-full uppercase tracking-wider">
                                    Solo Lectura
                                </span>
                            </div>
                            <p class="text-[9px] md:text-[10px] font-bold tracking-[0.2em] text-white/40 uppercase">
                                Visualización del torneo • Podio y resultados en vivo
                            </p>
                        </div>
                    </div>
                    <span class="material-symbols-outlined text-white/30 group-hover:text-white/60 transition-colors shrink-0">arrow_forward</span>
                </button>
            </div>

            <!-- SECCIÓN DE PATROCINADORES -->
            <div
                class="relative w-full max-w-7xl p-8 md:p-10 border border-[#353534]/30 rounded-[4rem] bg-[#131313]/60 backdrop-blur-sm shadow-xl mx-12 z-10 shrink-0 mb-12">
                <!-- Tactical Corner Borders -->
                <div
                    class="absolute top-0 left-0 w-12 h-12 border-t-2 border-l-2 border-neutral-700 rounded-tl-[4rem] -translate-x-[1px] -translate-y-[1px] opacity-60">
                </div>
                <div
                    class="absolute top-0 right-0 w-12 h-12 border-t-2 border-r-2 border-neutral-700 rounded-tr-[4rem] translate-x-[1px] -translate-y-[1px] opacity-60">
                </div>
                <div
                    class="absolute bottom-0 left-0 w-12 h-12 border-b-2 border-l-2 border-neutral-700 rounded-bl-[4rem] -translate-x-[1px] translate-y-[1px] opacity-60">
                </div>
                <div
                    class="absolute bottom-0 right-0 w-12 h-12 border-b-2 border-r-2 border-neutral-700 rounded-br-[4rem] translate-x-[1px] translate-y-[1px] opacity-60">
                </div>

                <p
                    class="text-[10px] md:text-[12px] font-black tracking-[0.6em] text-gray-500 uppercase text-center mb-8 headline">
                    Official Event Support Core</p>

                <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-6 lg:gap-8 w-full relative z-10">
                    <div @click="selectedSponsor = { name: 'UNIVERSIDAD DEL MAGDALENA', img: 'js/public/Patricinadores/Unimag.jpeg', tag: 'Aliado Académico Nacional' }; showSponsorModal = true"
                        class="glass-card p-4 rounded-[1.5rem] flex flex-col items-center gap-3 group cursor-pointer transition-all duration-300 hover:bg-white/10 hover:-translate-y-1">
                        <div
                            class="w-14 h-14 md:w-20 md:h-20 rounded-xl bg-white flex items-center justify-center overflow-hidden shadow-xl">
                            <img src="js/public/Patricinadores/Unimag.jpeg" class="w-full h-full object-contain p-2"
                                alt="Universidad del Magdalena">
                        </div>
                        <div class="text-center">
                            <div
                                class="headline-font font-black text-white text-[9px] md:text-[11px] uppercase tracking-tight">
                                UNIMAGDALENA</div>
                        </div>
                    </div>

                    <!-- Robokids PNG -->
                    <div @click="selectedSponsor = { name: 'ROBOKIDS', img: 'js/public/Patricinadores/Robokids.png', tag: 'Organizador del Evento' }; showSponsorModal = true"
                        class="glass-card p-4 rounded-[1.5rem] flex flex-col items-center gap-3 group cursor-pointer transition-all duration-300 hover:bg-white/10 hover:-translate-y-1">
                        <div
                            class="w-14 h-14 md:w-20 md:h-20 rounded-xl bg-white flex items-center justify-center overflow-hidden shadow-xl">
                            <img src="js/public/Patricinadores/Robokids.png" class="w-full h-full object-contain p-2"
                                alt="RoboKids">
                        </div>
                        <div class="text-center">
                            <div
                                class="headline-font font-black text-white text-[9px] md:text-[11px] uppercase tracking-tight">
                                ROBOKIDS</div>
                        </div>
                    </div>

                    <!-- Arcas -->
                    <div @click="selectedSponsor = { name: 'ARCAS', img: 'js/public/Patricinadores/Arcas.jpeg', tag: 'Patrocinador Platinum' }; showSponsorModal = true"
                        class="glass-card p-4 rounded-[1.5rem] flex flex-col items-center gap-3 group cursor-pointer transition-all duration-300 hover:bg-white/10 hover:-translate-y-1">
                        <div
                            class="w-14 h-14 md:w-20 md:h-20 rounded-xl bg-white flex items-center justify-center overflow-hidden shadow-xl">
                            <img src="js/public/Patricinadores/Arcas.jpeg" class="w-full h-full object-contain p-2"
                                alt="ARCAS">
                        </div>
                        <div class="text-center">
                            <div
                                class="headline-font font-black text-white text-[9px] md:text-[11px] uppercase tracking-tight">
                                ARCAS</div>
                        </div>
                    </div>

                    <!-- Tesum -->
                    <div @click="selectedSponsor = { name: 'TESUM Teslatronica Sumador S.A.S', img: 'js/public/Patricinadores/Tesum.png', tag: 'Innovación y Diseño' }; showSponsorModal = true"
                        class="glass-card p-4 rounded-[1.5rem] flex flex-col items-center gap-3 group cursor-pointer transition-all duration-300 hover:bg-white/10 hover:-translate-y-1">
                        <div
                            class="w-14 h-14 md:w-20 md:h-20 rounded-xl bg-white flex items-center justify-center overflow-hidden shadow-xl">
                            <img src="js/public/Patricinadores/Tesum.png" class="w-full h-full object-contain p-2"
                                alt="TESUM">
                        </div>
                        <div class="text-center">
                            <div
                                class="headline-font font-black text-white text-[9px] md:text-[11px] uppercase tracking-tight">
                                TESUM</div>
                        </div>
                    </div>

                    <!-- Rkids -->
                    <div @click="selectedSponsor = { name: 'RKIDS TECH SOLUTIONS', img: 'js/public/Patricinadores/Rkids.jpeg', tag: 'Logística Tecnológica' }; showSponsorModal = true"
                        class="glass-card p-4 rounded-[1.5rem] flex flex-col items-center gap-3 group cursor-pointer transition-all duration-300 hover:bg-white/10 hover:-translate-y-1">
                        <div
                            class="w-14 h-14 md:w-20 md:h-20 rounded-xl bg-white flex items-center justify-center overflow-hidden shadow-xl">
                            <img src="js/public/Patricinadores/Rkids.jpeg" class="w-full h-full object-contain p-2"
                                alt="Rkids">
                        </div>
                        <div class="text-center">
                            <div
                                class="headline-font font-black text-white text-[9px] md:text-[11px] uppercase tracking-tight">
                                R-KIDS</div>
                        </div>
                    </div>

                    <!-- ALT+TEND -->
                    <div @click="selectedSponsor = { name: 'Asociación de Licenciatura en Tecnología - Unimagdalena', img: 'js/public/Patricinadores/alt_tend.png', tag: 'Org. Académico Unimagdalena' }; showSponsorModal = true"
                        class="glass-card p-4 rounded-[1.5rem] flex flex-col items-center gap-3 group cursor-pointer transition-all duration-300 hover:bg-white/10 hover:-translate-y-1">
                        <div
                            class="w-14 h-14 md:w-20 md:h-20 rounded-xl bg-white flex items-center justify-center overflow-hidden shadow-xl">
                            <img src="js/public/Patricinadores/alt_tend.png" class="w-full h-full object-contain p-2"
                                alt="ALT+TEND">
                        </div>
                        <div class="text-center">
                            <div
                                class="headline-font font-black text-white text-[9px] md:text-[11px] uppercase tracking-tight">
                                ALT+TEND</div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- MODAL DE PATROCINADOR (VISOR EQUILIBRADO) -->
            <div class="fixed inset-0 z-[5000] flex items-center justify-center p-6 md:p-8 bg-black/95 backdrop-blur-2xl"
                x-show="showSponsorModal" x-cloak x-transition:enter="transition ease-out duration-300"

                                        <div class="space-y-2">
                                            <div class="flex justify-between items-center px-2">
                                                <label class="text-[10px] text-gray-400 font-black uppercase tracking-widest">N° Registro / Identificador</label>
                                                <span class="text-[9px] text-accent-gold font-bold">Formato 01, 02...</span>
                                            </div>
                                            <input type="text" x-model="$store.app.editingTeam.numero_registro" placeholder="01"
                                                class="w-full bg-white/5 border border-white/10 px-4 py-3 rounded-xl text-white headline text-base focus:outline-none focus:border-accent-gold">
                                        </div>

                                        <!-- Categoría -->
                                        <div class="space-y-2">
                                            <label class="text-[10px] text-gray-400 font-black uppercase tracking-widest ml-2">Categoría</label>
                                            <select x-model="$store.app.editingTeam.categoria"
                                                class="w-full bg-surface-container-high border border-white/10 px-4 py-3 rounded-xl text-white headline text-sm focus:outline-none focus:border-accent-gold appearance-none cursor-pointer">
                                                <option value="Exploradores">EXPLORADORES</option>
                                                <option value="Ingenieros">INGENIEROS</option>
                                                <option value="Masters">MASTERS</option>
                                            </select>
                                        </div>
                                    </div>

                                    <!-- Dimensiones Técnicas -->
                                    <div class="grid grid-cols-3 gap-4">
                                        <div class="space-y-2">
                                            <label class="text-[9px] text-gray-400 font-black uppercase tracking-widest">Peso (g)</label>
                                            <input type="number" min="0" step="1" x-model.number="$store.app.editingTeam.peso_cohete"
                                                class="w-full bg-white/5 border border-white/10 px-3 py-2.5 rounded-xl text-white headline text-sm text-center focus:outline-none focus:border-accent-gold">
                                        </div>
                                        <div class="space-y-2">
                                            <label class="text-[9px] text-gray-400 font-black uppercase tracking-widest">Altura (cm)</label>
                                            <input type="number" min="0" step="0.1" x-model.number="$store.app.editingTeam.altura_cohete"
                                                class="w-full bg-white/5 border border-white/10 px-3 py-2.5 rounded-xl text-white headline text-sm text-center focus:outline-none focus:border-accent-gold">
                                        </div>
                                        <div class="space-y-2">
                                            <label class="text-[9px] text-gray-400 font-black uppercase tracking-widest">Diámetro (cm)</label>
                                            <input type="number" min="0" max="12.5" step="0.1" x-model.number="$store.app.editingTeam.diametro_cohete"
                                                class="w-full bg-white/5 border border-white/10 px-3 py-2.5 rounded-xl text-white headline text-sm text-center focus:outline-none focus:border-accent-gold">
                                        </div>
                                    </div>

                                    <!-- Integrantes del Equipo -->
                                    <div class="space-y-3">
                                        <label class="text-[10px] text-gray-400 font-black uppercase tracking-widest ml-2">Integrantes del Equipo</label>
                                        <div class="flex gap-3">
                                            <input type="text" x-model="$store.app.editMemberInput"
                                                @keydown.enter.prevent="$store.app.addEditMember()"
                                                placeholder="NOMBRE DEL INTEGRANTE"
                                                class="flex-1 bg-white/5 border border-white/10 px-4 py-2.5 rounded-xl text-white headline text-sm focus:outline-none focus:border-accent-gold">
                                            <button type="button" @click="$store.app.addEditMember()"
                                                class="bg-accent-gold text-black px-5 py-2.5 rounded-xl font-black headline text-sm hover:bg-[#e6c200] transition-all cursor-pointer">
                                                Agregar
                                            </button>
                                        </div>
                                        <div class="flex flex-wrap gap-2 mt-2">
                                            <template x-for="(miembro, mIdx) in ($store.app.editingTeam.miembros || [])" :key="mIdx">
                                                <div class="bg-white/5 border border-white/10 px-3 py-1.5 rounded-xl flex items-center gap-2">
                                                    <span class="text-xs text-white font-bold headline" x-text="miembro"></span>
                                                    <button type="button" @click="$store.app.removeEditMember(mIdx)" class="text-gray-500 hover:text-primary">
                                                        <span class="material-symbols-outlined text-[16px]">close</span>
                                                    </button>
                                                </div>
                                            </template>
                                        </div>
                                    </div>
                                </div>
                            </template>

                            <div class="flex flex-col md:flex-row gap-4 border-t border-white/5 pt-6">
                                <button type="button" @click="$store.app.closeEditTeamModal()"
                                    class="w-full md:w-1/3 bg-transparent border border-white/20 text-white hover:bg-white/10 font-black headline py-3.5 rounded-xl transition-all uppercase tracking-widest text-xs cursor-pointer">
                                    Cancelar
                                </button>
                                <button type="submit"
                                    class="w-full md:w-2/3 bg-accent-gold hover:bg-[#e6c200] text-black font-black headline py-3.5 rounded-xl transition-all uppercase tracking-widest text-xs flex justify-center items-center gap-2 cursor-pointer shadow-lg shadow-accent-gold/20">
                                    <span>Guardar Datos</span>
                                </button>
                            </div>
                        </form>
                    </div>
                </div>

            </main>
        </div>
    </template>
</body>

</html>

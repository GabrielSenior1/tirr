<head>

    <title>ZENITH - Sistema Internacional de Lanzamiento de Cohetes</title>

    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        html,
        body {
            overflow-x: hidden;
            width: 100%;
            max-width: 100vw;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Manrope', sans-serif;
            background-color: #141721;
            color: #F1F5F9;
        }

        .headline {
            font-family: 'Space Grotesk', sans-serif;
        }

        .material-symbols-outlined {
            font-family: 'Material Symbols Outlined' !important;
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

        .glass-panel {
            background: rgba(28, 34, 48, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        /* ========================================================
           LOGIN TÁCTICO ZENITH - ULTRA-MODERNO Y ROBUSTO
           ======================================================== */
        .login-screen-wrapper {
            min-height: 100vh !important;
            width: 100% !important;
            display: flex !important;
            flex-direction: column !important;
            align-items: center !important;
            justify-content: space-between !important;
            padding: 24px 16px 36px 16px !important;
            box-sizing: border-box !important;
            position: relative !important;
            overflow-x: hidden !important;
            margin: 0 auto !important;
        }

        .login-header-section {
            text-align: center !important;
            margin: 10px auto 24px auto !important;
            padding: 0 16px !important;
            position: relative !important;
            z-index: 10 !important;
            max-width: 900px !important;
            width: 100% !important;
        }

        .login-subtitle {
            font-family: 'Space Grotesk', -apple-system, sans-serif !important;
            color: #ff6b2b !important;
            font-weight: 800 !important;
            letter-spacing: 0.45em !important;
            font-size: 10px !important;
            text-transform: uppercase !important;
            margin-bottom: 8px !important;
            text-shadow: 0 0 14px rgba(255, 107, 43, 0.4) !important;
            text-align: center !important;
        }

        .login-title {
            font-family: 'Space Grotesk', -apple-system, sans-serif !important;
            font-size: 2.25rem !important;
            font-weight: 900 !important;
            letter-spacing: -0.02em !important;
            color: #ffffff !important;
            line-height: 1.05 !important;
            margin: 0 !important;
            text-transform: uppercase !important;
            text-align: center !important;
        }

        @media (min-width: 640px) {
            .login-title {
                font-size: 3.5rem !important;
            }
        }

        .login-title .highlight-red {
            color: #ff6b2b !important;
            text-shadow: 0 0 24px rgba(255, 107, 43, 0.6) !important;
        }

        .login-title .highlight-gold {
            color: #fbbf24 !important;
            text-shadow: 0 0 24px rgba(251, 191, 36, 0.6) !important;
        }

        .login-title-bar {
            width: 72px !important;
            height: 3px !important;
            background: linear-gradient(90deg, #ff6b2b 0%, #fbbf24 100%) !important;
            margin: 12px auto 0 auto !important;
            border-radius: 999px !important;
            box-shadow: 0 0 12px rgba(255, 107, 43, 0.7) !important;
        }

        /* User Selector Grid & Cards */
        .user-grid {
            display: grid !important;
            grid-template-columns: repeat(3, 1fr) !important;
            gap: 10px !important;
            width: 100% !important;
            max-width: 440px !important;
            margin: 0 auto 24px auto !important;
            padding: 0 8px !important;
            box-sizing: border-box !important;
            justify-content: center !important;
        }

        @media (min-width: 640px) {
            .user-grid {
                grid-template-columns: repeat(4, 1fr) !important;
                max-width: 600px !important;
                gap: 12px !important;
            }
        }

        @media (min-width: 1024px) {
            .user-grid {
                display: flex !important;
                flex-wrap: wrap !important;
                justify-content: center !important;
                gap: 12px !important;
                max-width: 1240px !important;
                margin: 0 auto 28px auto !important;
            }
        }

        .user-card {
            background: rgba(12, 23, 51, 0.85) !important;
            border: 1px solid rgba(56, 189, 248, 0.22) !important;
            border-radius: 1.25rem !important;
            padding: 16px 8px 12px 8px !important;
            display: flex !important;
            flex-direction: column !important;
            align-items: center !important;
            justify-content: center !important;
            cursor: pointer !important;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1) !important;
            position: relative !important;
            overflow: hidden !important;
            backdrop-filter: blur(12px) !important;
            -webkit-backdrop-filter: blur(12px) !important;
            box-sizing: border-box !important;
            min-height: 108px !important;
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.35) !important;
        }

        @media (min-width: 1024px) {
            .user-card {
                flex: 0 0 98px !important;
                max-width: 102px !important;
                width: 98px !important;
            }

        .user-card:hover {
            transform: translateY(-3px) scale(1.02) !important;
            border-color: rgba(56, 189, 248, 0.6) !important;
            background: rgba(18, 34, 74, 0.95) !important;
            box-shadow: 0 10px 28px rgba(0, 0, 0, 0.5), 0 0 20px rgba(56, 189, 248, 0.3) !important;

        .user-card:active {
            transform: scale(0.97) !important;
        }

        .user-avatar-circle {
            width: 44px !important;
            height: 44px !important;
            min-width: 44px !important;
            min-height: 44px !important;
            max-width: 44px !important;
            max-height: 44px !important;
            border-radius: 50% !important;
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
            margin-bottom: 8px !important;
            flex-shrink: 0 !important;
            position: relative !important;
            z-index: 2 !important;
            box-sizing: border-box !important;
        }

        .user-role-text {
            font-family: 'Space Grotesk', sans-serif !important;
            font-size: 10px !important;
            font-weight: 700 !important;
            color: #ffffff !important;
            text-align: center !important;
            letter-spacing: -0.01em !important;
            width: 100% !important;
            overflow: hidden !important;
            text-overflow: ellipsis !important;
            white-space: nowrap !important;
            line-height: 1.2 !important;
            margin: 0 0 2px 0 !important;
            text-transform: uppercase !important;
        }

        .user-name-text {
            font-family: 'Manrope', sans-serif !important;
            font-size: 8.5px !important;
            font-weight: 600 !important;
            color: #94a3b8 !important;
            text-align: center !important;
            letter-spacing: 0.04em !important;
            text-transform: uppercase !important;
            width: 100% !important;
            overflow: hidden !important;
            text-overflow: ellipsis !important;
            white-space: nowrap !important;
            line-height: 1.2 !important;
            margin: 0 !important;
        }

        /* Quick Access Grid */
        .login-quick-grid {
            display: grid !important;
            grid-template-columns: 1fr !important;
            gap: 12px !important;
            width: 100% !important;
            max-width: 820px !important;
            margin: 0 auto 24px auto !important;
            padding: 0 12px !important;
            position: relative !important;
            z-index: 10 !important;
            box-sizing: border-box !important;
        }

        @media (min-width: 640px) {
            .login-quick-grid {
                grid-template-columns: 1fr 1fr !important;
                gap: 16px !important;
            }
        }

        .quick-btn-test {
            background: rgba(79, 70, 229, 0.14) !important;
            border: 1px solid rgba(129, 140, 248, 0.4) !important;
            border-radius: 1.25rem !important;
            padding: 16px 20px !important;
            display: flex !important;
            align-items: center !important;
            justify-content: space-between !important;
            cursor: pointer !important;
            transition: all 0.25s ease !important;
            backdrop-filter: blur(10px) !important;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.35) !important;
            text-align: left !important;
            color: #ffffff !important;
            width: 100% !important;
            box-sizing: border-box !important;
        }

        .quick-btn-test:hover {
            background: rgba(79, 70, 229, 0.28) !important;
            border-color: rgba(165, 180, 252, 0.7) !important;
            box-shadow: 0 0 25px rgba(99, 102, 241, 0.35) !important;
            transform: translateY(-2px) !important;
        }

        .quick-btn-guest {
            background: rgba(2, 132, 199, 0.12) !important;
            border: 1px solid rgba(56, 189, 248, 0.35) !important;
            border-radius: 1.25rem !important;
            padding: 16px 20px !important;
            display: flex !important;
            align-items: center !important;
            justify-content: space-between !important;
            cursor: pointer !important;
            transition: all 0.25s ease !important;
            backdrop-filter: blur(10px) !important;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.35) !important;
            text-align: left !important;
            color: #ffffff !important;
            width: 100% !important;
            box-sizing: border-box !important;
        }

        .quick-btn-guest:hover {
            background: rgba(2, 132, 199, 0.24) !important;
            border-color: rgba(56, 189, 248, 0.7) !important;
            box-shadow: 0 0 25px rgba(56, 189, 248, 0.35) !important;
            transform: translateY(-2px) !important;
        }

        /* Sponsors Section */
        .login-sponsors-section {
            width: 100% !important;
            max-width: 600px !important;
            margin: 0 auto !important;
            text-align: center !important;
            padding: 0 16px !important;
            position: relative !important;
            z-index: 10 !important;
        }

        .login-sponsors-title {
            font-family: 'Space Grotesk', sans-serif !important;
            font-size: 9px !important;
            font-weight: 700 !important;
            letter-spacing: 0.35em !important;
            color: #94a3b8 !important;

            text-align: center !important;

        .login-sponsors-pill-row {
            display: flex !important;

            justify-content: center !important;
            gap: 10px !important;

        .login-sponsor-pill {
            display: inline-flex !important;

            background: rgba(12, 23, 51, 0.8) !important;

        .login-sponsor-pill span {

            font-size: 9px !important;
            font-weight: 700 !important;
            letter-spacing: 0.08em !important;
            color: #cbd5e1 !important;
        }

        .kinetic-glow:hover {
            box-shadow: 0 0 20px rgba(226, 74, 74, 0.2);
        }

        /* Tactical soft glows (non-fluorescent, eye-friendly) */
        .hover-glow-red:hover {
            box-shadow: 0 0 20px rgba(226, 74, 74, 0.25);
            border-color: rgba(226, 74, 74, 0.4);
        }

        .hover-glow-yellow:hover {
            box-shadow: 0 0 20px rgba(245, 158, 11, 0.25);
            border-color: rgba(245, 158, 11, 0.4);
        }

        .hover-glow-emerald:hover {

            border-color: rgba(16, 185, 129, 0.4);
        }

        .hover-glow-cyan:hover {
            box-shadow: 0 0 20px rgba(14, 165, 233, 0.25);

        .neon-glow-red {

        }

        }

        .red-glow {

        .yellow-glow {
            box-shadow: 0 0 15px rgba(245, 158, 11, 0.15);
        }

        .green-glow {
            box-shadow: 0 0 15px rgba(16, 185, 129, 0.15);
        }

        .cyan-glow {
            box-shadow: 0 0 15px rgba(14, 165, 233, 0.15);
        }

        .headline-font {
            font-family: 'Space Grotesk', sans-serif;
        }

        .quick-access-btn {
            background: rgba(14, 26, 56, 0.9) !important;
            border: 1px solid rgba(56, 189, 248, 0.25) !important;
            color: #ffffff !important;
        }

        .quick-access-btn:hover {
            background: rgba(22, 39, 79, 0.98) !important;
            border-color: rgba(56, 189, 248, 0.6) !important;
        }

        .login-modal-box {
            background: #0c1733 !important;
            border: 1px solid rgba(56, 189, 248, 0.3) !important;

        /* Sponsors strict sizing to prevent mobile & desktop viewport blowout */
        .sponsor-logo {

        #mobile-menu-checkbox:checked~aside {

        [x-cloak] {

</head>

<body class="custom-scrollbar overflow-x-hidden antialiased bg-[#070d1f] text-white" x-cloak
    style="background: radial-gradient(circle at 75% 15%, #132554 0%, #0c1733 45%, #070d1f 100%); min-height: 100vh;"
    x-data="{ activeTab: localStorage.getItem('activeTab') || 'dashboard' }"
    x-init="$watch('activeTab', val => { if(val) localStorage.setItem('activeTab', val); else localStorage.removeItem('activeTab'); }); document.addEventListener('guest:login', () => { activeTab = 'dashboard'; }); if (!localStorage.getItem('zenith_last_active')) { activeTab = 'dashboard'; }">

    <!-- Loader Inicial: controlado por JS puro, sin Alpine -->
    <div id="loading-screen"
        style="display:flex; position:fixed; inset:0; z-index:9999; background:#070d1f; flex-direction:column; align-items:center; justify-content:center; transition:opacity 0.4s;">
        <div style="display:flex; flex-direction:column; align-items:center; gap:16px;">
            <div
                style="width:48px;height:48px;border:4px solid rgba(255,107,43,0.15);border-top-color:#ff6b2b;border-radius:50%;animation:spin 0.8s linear infinite;">
            </div>
            <p style="font-size:10px;font-weight:900;letter-spacing:0.5em;color:#ff6b2b;text-transform:uppercase;">
                Iniciando Sistemas ZENITH</p>
        </div>
    </div>
    <style>
        @keyframes spin {
            to {
                transform: rotate(360deg)
            }
        }
    </style>

    <!-- PANTALLA 1: LOGIN TÁCTICO (SELECCIÓN DE PERSONAL) -->
    <template x-if="!$store.app.isAuthenticated && !$store.app.isLoadingInitial">
        <div class="login-screen-wrapper custom-scrollbar"
            x-data="{ 
                selectedSponsor: null, 
                showSponsorModal: false,
                localShowLogin: false,
                localUser: null,
                localPin: '',
                localError: null,
                localLoading: false,
                openLoginForm(u) {
                    this.localUser = u;
                    this.localPin = '';
                    this.localError = null;
                    this.localShowLogin = true;
                },
                async doLogin() {
                    if (!this.localUser || !this.localPin) return;
                    this.localLoading = true;
                    this.localError = null;
                    
                    // Aseguramos que pasamos los datos hacia el store global para usar firebase
                    $store.app.selectedLoginUser = this.localUser;
                    $store.app.loginPin = this.localPin;
                    
                    await $store.app.login();
                    
                    if ($store.app.loginError) {
                        this.localError = $store.app.loginError;
                    } else {
                        this.localShowLogin = false;
                    }
                    
                    this.localLoading = false;
                }
             }">

            <!-- Corner Ornaments for Login -->
            <div
                class="hidden sm:block fixed top-6 left-6 w-32 h-32 border-t border-l border-white/5 pointer-events-none rounded-tl-[3rem]">
            </div>
            <div
                class="hidden sm:block fixed top-6 right-6 w-32 h-32 border-t border-r border-white/5 pointer-events-none rounded-tr-[3rem]">
            </div>
            <div
                class="hidden sm:block fixed bottom-6 left-6 w-32 h-32 border-b border-l border-white/5 pointer-events-none rounded-bl-[3rem]">
            </div>
            <div
                class="hidden sm:block fixed bottom-6 right-6 w-32 h-32 border-b border-r border-white/5 pointer-events-none rounded-br-[3rem]">
            </div>

            <!-- Header Section -->
            <div class="login-header-section">
                <p class="login-subtitle">Torneo Internacional de Lanzamiento de Cohetes</p>
                <h1 class="login-title">
                    <span>SISTEMA</span> <span class="highlight-red">ZEN</span><span class="highlight-gold">ITH</span>
                </h1>
                <div class="login-title-bar"></div>
            </div>

            <!-- Dock de Usuarios (11 perfiles con badge de alto contraste) -->
            <div class="user-grid relative z-10">
                <template :key="user.email + (user.photoURL || 'none')" x-for="user in $store.app.systemUsers">
                    <div @click="openLoginForm(user)" class="user-card group" :data-role="user.role">

                        <!-- Ambient background light matching user color -->
                        <div :style="'background: ' + user.hex"
                            class="absolute -top-10 -right-10 w-20 h-20 blur-2xl opacity-10 pointer-events-none group-hover:opacity-25 transition-opacity">
                        </div>

                        <!-- Solid Glowing Avatar Circle with Black Contrast Icon -->
                        <div class="user-avatar-circle"
                            :style="'background-color: ' + user.hex + '; box-shadow: 0 0 16px ' + user.hex + '90;'">
                            <template x-if="user.photoURL">
                                <img :src="user.photoURL" class="w-full h-full object-cover rounded-full">
                            </template>
                            <template x-if="!user.photoURL">
                                <span class="material-symbols-outlined text-black font-black select-none text-[22px]"
                                    x-text="user.role.includes('CRONOMETRISTA') ? 'timer' : user.role.includes('PRUEBA') ? 'science' : user.role.includes('AUXILIAR') ? 'engineering' : user.role.includes('ADMIN') ? 'admin_panel_settings' : 'gavel'"></span>
                            </template>
                        </div>

                        <!-- Role & Name Labels -->
                        <h3 class="user-role-text" x-text="user.role"></h3>
                        <p class="user-name-text" x-text="user.name"></p>
                    </div>
                </template>
            </div>

            <!-- ACCESOS RÁPIDOS EXTERNOS: VISTA DE PRUEBA E INVITADO -->
            <div class="login-quick-grid">
                <!-- BOTÓN 1: VISTA DE PRUEBA -->
                <button @click="openLoginForm($store.app.systemUsers.find(u => u.role === 'VISTA DE PRUEBA'))"
                    id="btn-vista-prueba" data-testid="login-vista-prueba"

                                    <h3 :class="equipoDescalificado ? 'text-primary' : 'text-white'"
                                        class="headline font-bold text-xs uppercase tracking-widest">Descalificar</h3>
                                    <div @click="equipoDescalificado = !equipoDescalificado"
                                        class="relative w-16 h-8 bg-black/40 rounded-full cursor-pointer flex items-center px-1">
                                        <div :class="equipoDescalificado ? 'translate-x-[100%] bg-primary' : 'translate-x-0 bg-gray-500'"
                                            class="w-6 h-6 rounded-full transition-all transform flex items-center justify-center text-[8px] font-black text-white">
                                            <span x-text="equipoDescalificado ? 'SÍ' : 'NO'"></span>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <div class="flex flex-col md:flex-row gap-4 border-t border-white/5 pt-8">
                                <button @click="$store.app.closeModal()"
                                    class="w-full md:w-1/3 bg-transparent border border-white/20 text-white hover:bg-white/10 font-black headline py-4 rounded-2xl transition-all uppercase tracking-widest text-xs">
                                    Cerrar
                                </button>
                                <button @click="save()" :disabled="!selectedTeamId || isSubmitting"
                                    class="w-full md:w-2/3 bg-accent-gold hover:bg-[#e6c200] text-black font-black headline py-4 rounded-2xl transition-all uppercase tracking-widest text-xs flex justify-center items-center gap-2 disabled:opacity-50">
                                    <span x-show="!isSubmitting">Guardar Cambios</span>
                                    <span x-show="isSubmitting" class="flex gap-2 items-center"><span
                                            class="w-4 h-4 border-2 border-black/30 border-t-black rounded-full animate-spin"></span>
                                        Guardando...</span>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Modal Editar Datos del Equipo -->
                <div x-cloak x-show="$store.app.showEditTeamModal && $store.app.editingTeam"
                    class="fixed inset-0 z-[110] flex items-center justify-center p-4 bg-[#0D0F17]/85 backdrop-blur-xl"
                    x-transition>
                    <div class="bg-[#1C2230] border border-white/10 rounded-[3rem] w-full max-w-3xl max-h-[92vh] overflow-y-auto custom-scrollbar shadow-2xl relative"
                        @click.outside="$store.app.closeEditTeamModal()">

                        <div
                            class="sticky top-0 bg-[#1C2230]/90 backdrop-blur-md p-6 md:p-8 border-b border-white/5 flex justify-between items-center z-10">
                            <div>
                                <h3 class="text-2xl font-black headline text-white uppercase tracking-tighter">
                                    Editar Datos del Equipo
                                </h3>
                                <p class="text-[10px] text-accent-gold font-bold uppercase tracking-widest mt-1"
                                    x-text="$store.app.editingTeam ? ($store.app.formatTeamName($store.app.editingTeam)) : ''">
                                </p>
                            </div>
                            <button @click="$store.app.closeEditTeamModal()"
                                class="w-10 h-10 rounded-full bg-white/5 border border-white/10 flex items-center justify-center text-gray-400 hover:bg-white/10 hover:text-white transition-colors cursor-pointer">
                                <span class="material-symbols-outlined">close</span>
                            </button>
                        </div>

                        <form @submit.prevent="$store.app.updateTeam()" class="p-6 md:p-8 space-y-6">
                            <template x-if="$store.app.editingTeam">
                                <div class="space-y-6">
                                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                                        <!-- Nombre Equipo -->
                                        <div class="space-y-2">
                                            <label
                                                class="text-[10px] text-gray-400 font-black uppercase tracking-widest ml-2">Nombre
                                                del Equipo</label>
                                            <input type="text" x-model="$store.app.editingTeam.nombre_equipo" required
                                                class="w-full bg-white/5 border border-white/10 px-4 py-3 rounded-xl text-white headline text-base focus:outline-none focus:border-accent-gold">
                                        </div>

                                        <!-- Nombre Cohete -->
                                        <div class="space-y-2">
                                            <label
                                                class="text-[10px] text-gray-400 font-black uppercase tracking-widest ml-2">Nombre
                                                del Cohete</label>
                                            <input type="text" x-model="$store.app.editingTeam.nombre_cohete"
                                                class="w-full bg-white/5 border border-white/10 px-4 py-3 rounded-xl text-white headline text-base focus:outline-none focus:border-accent-gold">
                                        </div>
                                    </div>

                                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                                        <!-- Número de Registro -->
                                        <div class="space-y-2">
                                            <div class="flex justify-between items-center px-2">
                                                <label
                                                    class="text-[10px] text-gray-400 font-black uppercase tracking-widest">N°
                                                    Registro / Identificador</label>
                                                <span class="text-[9px] text-accent-gold font-bold">Formato 01,
                                                    02...</span>
                                            </div>
                                            <input type="text" x-model="$store.app.editingTeam.numero_registro"
                                                placeholder="01"
                                                class="w-full bg-white/5 border border-white/10 px-4 py-3 rounded-xl text-white headline text-base focus:outline-none focus:border-accent-gold">
                                        </div>

                                        <!-- Categoría -->
                                        <div class="space-y-2">
                                            <label
                                                class="text-[10px] text-gray-400 font-black uppercase tracking-widest ml-2">Categoría</label>
                                            <select x-model="$store.app.editingTeam.categoria"
                                                class="w-full bg-surface-container-high border border-white/10 px-4 py-3 rounded-xl text-white headline text-sm focus:outline-none focus:border-accent-gold appearance-none cursor-pointer">
                                                <option value="Exploradores">EXPLORADORES</option>
                                                <option value="Ingenieros">INGENIEROS</option>
                                                <option value="Masters">MASTERS</option>
                                            </select>
                                        </div>
                                    </div>

                                    <!-- Dimensiones Técnicas -->
                                    <div class="grid grid-cols-3 gap-4">
                                        <div class="space-y-2">
                                            <label
                                                class="text-[9px] text-gray-400 font-black uppercase tracking-widest">Peso
                                                (g)</label>
                                            <input type="number" min="0" step="1"
                                                x-model.number="$store.app.editingTeam.peso_cohete"
                                                class="w-full bg-white/5 border border-white/10 px-3 py-2.5 rounded-xl text-white headline text-sm text-center focus:outline-none focus:border-accent-gold">
                                        </div>
                                        <div class="space-y-2">
                                            <label
                                                class="text-[9px] text-gray-400 font-black uppercase tracking-widest">Altura
                                                (cm)</label>
                                            <input type="number" min="0" step="0.1"
                                                x-model.number="$store.app.editingTeam.altura_cohete"
                                                class="w-full bg-white/5 border border-white/10 px-3 py-2.5 rounded-xl text-white headline text-sm text-center focus:outline-none focus:border-accent-gold">
                                        </div>
                                        <div class="space-y-2">
                                            <label
                                                class="text-[9px] text-gray-400 font-black uppercase tracking-widest">Diámetro
                                                (cm)</label>
                                            <input type="number" min="0" max="12.5" step="0.1"
                                                x-model.number="$store.app.editingTeam.diametro_cohete"
                                                class="w-full bg-white/5 border border-white/10 px-3 py-2.5 rounded-xl text-white headline text-sm text-center focus:outline-none focus:border-accent-gold">
                                        </div>
                                    </div>

                                    <!-- Integrantes del Equipo -->
                                    <div class="space-y-3">
                                        <label
                                            class="text-[10px] text-gray-400 font-black uppercase tracking-widest ml-2">Integrantes
                                            del Equipo</label>
                                        <div class="flex gap-3">
                                            <input type="text" x-model="$store.app.editMemberInput"
                                                @keydown.enter.prevent="$store.app.addEditMember()"
                                                placeholder="NOMBRE DEL INTEGRANTE"
                                                class="flex-1 bg-white/5 border border-white/10 px-4 py-2.5 rounded-xl text-white headline text-sm focus:outline-none focus:border-accent-gold">
                                            <button type="button" @click="$store.app.addEditMember()"
                                                class="bg-accent-gold text-black px-5 py-2.5 rounded-xl font-black headline text-sm hover:bg-[#e6c200] transition-all cursor-pointer">
                                                Agregar
                                            </button>
                                        </div>
                                        <div class="flex flex-wrap gap-2 mt-2">
                                            <template x-for="(miembro, mIdx) in ($store.app.editingTeam.miembros || [])"
                                                :key="mIdx">
                                                <div
                                                    class="bg-white/5 border border-white/10 px-3 py-1.5 rounded-xl flex items-center gap-2">
                                                    <span class="text-xs text-white font-bold headline"
                                                        x-text="miembro"></span>
                                                    <button type="button" @click="$store.app.removeEditMember(mIdx)"
                                                        class="text-gray-500 hover:text-primary">
                                                        <span class="material-symbols-outlined text-[16px]">close</span>
                                                    </button>
                                                </div>
                                            </template>
                                        </div>
                                    </div>
                                </div>
                            </template>

                            <div class="flex flex-col md:flex-row gap-4 border-t border-white/5 pt-6">
                                <button type="button" @click="$store.app.closeEditTeamModal()"
                                    class="w-full md:w-1/3 bg-transparent border border-white/20 text-white hover:bg-white/10 font-black headline py-3.5 rounded-xl transition-all uppercase tracking-widest text-xs cursor-pointer">
                                    Cancelar
                                </button>
                                <button type="submit"
                                    class="w-full md:w-2/3 bg-accent-gold hover:bg-[#e6c200] text-black font-black headline py-3.5 rounded-xl transition-all uppercase tracking-widest text-xs flex justify-center items-center gap-2 cursor-pointer shadow-lg shadow-accent-gold/20">
                                    <span>Guardar Datos</span>
                                </button>
                            </div>
                        </form>
                    </div>
                </div>

            </main>
        </div>
    </template>
</body>

</html>
